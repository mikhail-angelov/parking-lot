version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - errorlint
    - gochecknoinits
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nestif
    - prealloc
    - revive
    - staticcheck
    - testifylint
    - unconvert
    - unparam
    - unused
    - wrapcheck
  settings:
    gocritic:
      disabled-checks: [wrapperFunc, hugeParam, rangeValCopy, singleCaseSwitch, ifElseChain]
      enabled-tags: [performance, style, experimental]
    govet:
      enable: [shadow]
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters: [revive]
        text: 'package-comments: should have a package comment'
      - linters: [staticcheck]
        text: at least one file in a package should have a package comment
      - linters: [dupl, gosec]
        path: _test\.go
      - linters: [revive, unparam, unused]
        path: _test\.go$
        text: unused-parameter
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths: [third_party$, builtin$, examples$]
